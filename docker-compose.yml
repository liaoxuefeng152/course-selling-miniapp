version: '3.8'

services:
  # 生产环境
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: coze-mini-program
    ports:
      - "80:80"      # Nginx (前端)
      - "3000:3000"  # NestJS API (后端)
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - PROJECT_DOMAIN=http://localhost
    restart: unless-stopped
    networks:
      - coze-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis（可选，用于缓存）
  redis:
    image: redis:7-alpine
    container_name: coze-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - coze-network
    command: redis-server --appendonly yes

networks:
  coze-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
